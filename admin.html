<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safe Zone Admin V7</title><link rel="stylesheet" href="style.css">
<style>body{max-width:1100px;margin:auto;padding:20px}.panel{padding:20px;margin:15px 0;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(255,255,255,.035)}input,select{padding:11px;margin:5px;border-radius:10px;border:1px solid #555;background:#111;color:#fff}button{padding:10px 14px;margin:5px;border:0;border-radius:10px;cursor:pointer}.row{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}</style></head>
<body>
<h1>🛠️ Safe Zone Game Topup — Admin V7</h1>
<div class="panel"><h2>Admin Login</h2>
<input id="u" value="admin" placeholder="Username"><input id="p" type="password" placeholder="Admin password">
<button onclick="login()">Login</button><button onclick="logout()">Logout</button><span id="msg"></span></div>
<div class="panel"><h2>Orders</h2><button onclick="loadOrders()">Refresh</button><div id="orders"></div></div>
<div class="panel"><h2>Customers</h2><button onclick="loadUsers()">Refresh</button><div id="users"></div></div>
<div class="panel"><h2>Add Game</h2><input id="game" placeholder="Game name"><button onclick="addGame()">Add Game</button></div>
<div class="panel"><h2>Add Package</h2><input id="gid" type="number" placeholder="Game ID"><input id="pn" placeholder="Package name"><input id="price" type="number" placeholder="Price MMK"><button onclick="addPackage()">Add Package</button></div>
<div class="panel"><h2>Add Promo</h2><input id="pc" placeholder="Code"><select id="pt"><option value="percent">Percent</option><option value="fixed">Fixed MMK</option></select><input id="pv" type="number" placeholder="Value"><button onclick="addPromo()">Add Promo</button></div>
<script>
const K="sz_v7_admin"; const api=async(p,o={})=>{let h={"Content-Type":"application/json"};let t=localStorage.getItem(K);if(t)h.Authorization="Bearer "+t;let r=await fetch("/api"+p,{...o,headers:h});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Failed");return d};
async function login(){try{let d=await api("/admin/login",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});localStorage.setItem(K,d.token);msg.textContent=" Logged in";loadOrders();loadUsers()}catch(e){msg.textContent=" "+e.message}}
function logout(){localStorage.removeItem(K);location.reload()}
async function loadOrders(){try{let a=await api("/orders");orders.innerHTML=a.map(o=>`<div class="row"><b>${o.order_code}</b> · ${o.game} · ${o.package} · ${o.total} MMK · <b>${o.status}</b><br><button onclick="status(${o.id},'Processing')">Processing</button><button onclick="status(${o.id},'Completed')">Completed</button><button onclick="status(${o.id},'Rejected')">Rejected</button></div>`).join("")}catch(e){orders.textContent=e.message}}
async function status(id,s){try{await api("/admin/orders/"+id+"/status",{method:"POST",body:JSON.stringify({status:s})});loadOrders()}catch(e){alert(e.message)}}
async function loadUsers(){try{let a=await api("/admin/users");users.innerHTML=a.map(u=>`<div class="row"><b>${u.id}</b> · ${u.username} · Wallet: ${u.wallet_balance} MMK <button onclick="wallet(${u.id})">Adjust Wallet</button></div>`).join("")}catch(e){users.textContent=e.message}}
async function wallet(id){let a=prompt("Enter wallet adjustment in MMK (+credit / -debit):");if(a===null)return;try{await api("/admin/wallet/"+id,{method:"POST",body:JSON.stringify({amount:Number(a)})});loadUsers()}catch(e){alert(e.message)}}
async function addGame(){try{await api("/admin/games",{method:"POST",body:JSON.stringify({name:game.value})});game.value="";alert("Added")}catch(e){alert(e.message)}}
async function addPackage(){try{await api("/admin/packages",{method:"POST",body:JSON.stringify({gameId:Number(gid.value),name:pn.value,price:Number(price.value)})});alert("Added")}catch(e){alert(e.message)}}
async function addPromo(){try{await api("/admin/promos",{method:"POST",body:JSON.stringify({code:pc.value,type:pt.value,value:Number(pv.value)})});alert("Added")}catch(e){alert(e.message)}}
</script></body></html>
